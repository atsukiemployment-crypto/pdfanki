# Codemagic 用ビルド設定（フラット版）
# 全ファイルがリポジトリ直下にベタ置きされている前提で、
# ビルド開始時に Capacitor が必要とするフォルダ構成へ自動で振り分ける。
# （GitHubのWebアップロードでフォルダが扱えない問題への対応版）
#
# 事前準備（SETUP.md 参照）:
#   1. Codemagic の Team settings > Integrations > App Store Connect で
#      APIキーを「ASC_API_KEY」という名前で登録
#   2. 下の bundle_identifier と capacitor.config.json の appId を
#      自分のものに変更（両者を一致させること）

workflows:
  ios-testflight:
    name: iOS Build & TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ASC_API_KEY
    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.YOURNAME.pdfstudy"
      node: 20.11.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: フラット構成をフォルダ構成へ復元
        script: |
          # Webアプリ本体
          mkdir -p www
          cp index.html www/
          cp manifest.webmanifest www/
          cp icon-180.png icon-192.png icon-512.png www/
          # ネイティブプラグイン
          mkdir -p ios-extras
          cp PencilKitPlugin.swift PencilKitPlugin.m ios-extras/
          # CI補助スクリプト
          mkdir -p scripts
          cp add_plugin_files.rb scripts/
          # アプリアイコン・起動画面の素材
          mkdir -p assets
          cp icon-only.png splash.png splash-dark.png assets/
          echo "フォルダ構成を復元しました"
          ls -R www ios-extras scripts assets
      - name: npm依存の取得
        script: npm install
      - name: iOSプロジェクト生成
        script: npx cap add ios
      - name: XcodeプロジェクトのBundle IDと最低iOSバージョンを設定
        script: |
          # Capacitorが生成したXcodeプロジェクト内のPRODUCT_BUNDLE_IDENTIFIERを
          # 正しいBundle IDに揃える（これがズレているとプロファイルが一致せず署名に失敗する）。
          cd ios/App
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" App.xcodeproj/project.pbxproj
          # PencilKitはiOS 14以降の機能を使うため、最低対応バージョンを15.0に引き上げる。
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [^;]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" App.xcodeproj/project.pbxproj
          # ビルド番号を「現在時刻の通し番号」にして毎回必ず一意かつ増加させる。
          # App Store Connectは同じビルド番号を二度受け付けないため。
          NEW_BUILD=$(date +%Y%m%d%H%M)
          echo "ビルド番号: $NEW_BUILD"
          # project.pbxproj の CURRENT_PROJECT_VERSION を書き換え
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $NEW_BUILD;/g" App.xcodeproj/project.pbxproj
          # Info.plist の CFBundleVersion も直接書き換え（確実に効かせる）
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD" App/Info.plist 2>/dev/null || true
          echo "Bundle ID=$BUNDLE_ID / iOS=15.0 / build=$NEW_BUILD に設定しました"
          grep -m1 PRODUCT_BUNDLE_IDENTIFIER App.xcodeproj/project.pbxproj
          grep -m1 CURRENT_PROJECT_VERSION App.xcodeproj/project.pbxproj
          cd ../..
      - name: PencilKitプラグインを組み込み
        script: |
          cp ios-extras/PencilKitPlugin.swift ios/App/App/
          # 新方式(CAPBridgedPlugin)では .m ファイルは使わない（競合回避のためコピーしない）。
          # カスタムViewControllerを作り、capacitorDidLoadでPencilKitPluginを明示登録する。
          cat > ios/App/App/MainViewController.swift <<'SWIFTEOF'
          import UIKit
          import Capacitor

          class MainViewController: CAPBridgeViewController {
              override open func capacitorDidLoad() {
                  bridge?.registerPluginInstance(PencilKitPlugin())
              }
          }
          SWIFTEOF
          sed -i '' 's/^          //' ios/App/App/MainViewController.swift
          # Main.storyboard のカスタムクラスを MainViewController に変更
          sed -i '' 's/customClass="CAPBridgeViewController"/customClass="MainViewController"/g' ios/App/App/Base.lproj/Main.storyboard
          gem install xcodeproj --no-document
          ruby scripts/add_plugin_files.rb
          echo "MainViewController を作成し storyboard を更新しました"
      - name: アプリアイコン・起動画面を生成
        script: |
          npm install --save-dev @capacitor/assets
          npx @capacitor/assets generate --ios
      - name: Webアセット同期
        script: npx cap sync ios
      - name: 証明書とプロファイルを準備
        script: |
          # 手元の.p12をデコード
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          # キーチェーンに証明書を登録
          keychain initialize
          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"
          # .p12から秘密鍵(PEM)を取り出す。これをfetch-signing-filesに渡すと、
          # 証明書をPortalから新規作成せず、この鍵に対応する既存証明書を使い、
          # プロファイルだけを取得/作成する。
          openssl pkcs12 -in /tmp/certificate.p12 \
            -nodes -nocerts \
            -passin pass:"$CM_CERTIFICATE_PASSWORD" \
            -legacy 2>/dev/null \
            | openssl rsa -out /tmp/cert_key.pem 2>/dev/null \
            || openssl pkcs12 -in /tmp/certificate.p12 \
                 -nodes -nocerts \
                 -passin pass:"$CM_CERTIFICATE_PASSWORD" \
            | openssl rsa -out /tmp/cert_key.pem 2>/dev/null
          # プロファイルを取得/作成（証明書は上記の鍵に対応する既存ものを使う）
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: IPAビルド
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
